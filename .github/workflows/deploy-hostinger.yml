name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # cho phép bấm "Run workflow" chạy lại bằng tay

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=512'

      # Báo rõ secret nào còn thiếu (hiện ngay trong mục Annotations)
      - name: Check secrets
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER_NAME: ${{ secrets.HOSTINGER_USERNAME }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing HOSTINGER_HOST"
          [ -z "$USER_NAME" ] && missing="$missing HOSTINGER_USERNAME"
          [ -z "$KEY" ] && missing="$missing HOSTINGER_SSH_KEY"
          [ -z "$DOMAIN" ] && missing="$missing HOSTINGER_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::error title=Thiếu GitHub secret::Vào Settings → Secrets and variables → Actions và thêm:$missing"
            exit 1
          fi
          echo "Đủ secrets."

      - name: Deploy to Hostinger via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          command_timeout: 30m
          capture_stdout: true
          script: |
            fail() { echo "DEPLOY_FAIL::$1"; exit 0; }
            LOG=/tmp/genz-deploy-$$.log
            # Phiên SSH không tương tác không tự nạp PATH → nạp profile + nvm để thấy node/npm/pm2
            for f in "$HOME/.profile" "$HOME/.bash_profile" "$HOME/.bashrc"; do [ -f "$f" ] && . "$f" >/dev/null 2>&1; done
            export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1
            export PATH="$HOME/.npm-global/bin:$HOME/bin:$PATH"

            cd "$HOME/domains/${{ secrets.HOSTINGER_DOMAIN }}" 2>/dev/null || fail "Không có thư mục ~/domains/<HOSTINGER_DOMAIN>. Kiểm tra secret HOSTINGER_DOMAIN (chỉ tên miền, VD: tenmien.com)"
            [ -d .git ] || fail "Thư mục $(pwd) không phải git repo (chưa git clone code vào đây)"
            command -v node >/dev/null 2>&1 || fail "Không tìm thấy node trên server (cài Node.js hoặc nvm)"
            command -v npm >/dev/null 2>&1 || fail "Không tìm thấy npm trên server"
            echo "[deploy] thư mục: $(pwd) · node $(node -v) · npm $(npm -v)"

            # package-lock.json giờ đã nằm trong repo → bỏ bản cũ không được git theo dõi để pull không bị chặn
            git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 || rm -f package-lock.json
            git pull --ff-only origin main >"$LOG" 2>&1 || { tail -20 "$LOG"; fail "git pull lỗi (có thể code trên server bị sửa tay). Xem các dòng phía trên"; }
            echo "[deploy] git: $(git log --oneline -1)"

            npm ci >"$LOG" 2>&1 || { tail -30 "$LOG"; fail "npm ci lỗi. Xem các dòng phía trên"; }
            echo "[deploy] npm ci xong"
            npm run build >"$LOG" 2>&1 || { tail -40 "$LOG"; fail "npm run build lỗi. Xem các dòng phía trên"; }
            echo "[deploy] build xong"

            if command -v pm2 >/dev/null 2>&1; then PM2="pm2"; else PM2="npx --yes pm2"; fi
            $PM2 startOrRestart ecosystem.config.js >"$LOG" 2>&1 || { tail -20 "$LOG"; fail "pm2 khởi động lỗi. Xem các dòng phía trên"; }
            $PM2 save >/dev/null 2>&1
            $PM2 ls 2>/dev/null | grep -E "fullmovie" || true
            rm -f "$LOG"
            echo "DEPLOY_OK"

      # Đưa lý do lỗi lên mục Annotations để đọc được ngay, không cần mở log
      - name: Deploy result
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          OUT: ${{ steps.deploy.outputs.stdout }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if printf '%s' "$OUT" | grep -q "DEPLOY_OK"; then
            echo "::notice title=Deploy thành công::$(printf '%s' "$OUT" | grep '\[deploy\] git:' | sed 's/.*git: //')"
            exit 0
          fi
          if [ -z "$OUT" ]; then
            echo "::error title=Không SSH được vào Hostinger::Kiểm tra HOSTINGER_HOST, HOSTINGER_USERNAME, HOSTINGER_PORT (Hostinger thường là 65002) và HOSTINGER_SSH_KEY (private key đầy đủ, public key tương ứng đã thêm trong hPanel → SSH Access). Kết quả bước SSH: $OUTCOME"
            exit 1
          fi
          REASON=$(printf '%s' "$OUT" | grep "DEPLOY_FAIL::" | tail -1 | sed 's/.*DEPLOY_FAIL:://')
          DETAIL=$(printf '%s' "$OUT" | grep -v "DEPLOY_FAIL::" | tail -25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Deploy lỗi: ${REASON:-không rõ}::${DETAIL}"
          exit 1
